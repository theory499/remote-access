<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com wss://*.firebaseio.com:*; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Remote Desktop Host</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Remote Desktop Host</h1>
      <section class="card">
        <p class="label">Pairing code</p>
        <p id="pairing-code" class="code" aria-live="polite">------</p>
        <p id="status" class="status" aria-live="polite">Initialising</p>
      </section>
      <section class="card">
        <p class="label">Connection</p>
        <ul class="metrics">
          <li>WebRTC state: <span id="rtc-state">new</span></li>
          <li>ICE state: <span id="ice-state">new</span></li>
          <li>Round trip: <span id="rtt">-</span></li>
        </ul>
      </section>
      <section class="card">
        <button id="restart" type="button">Restart session</button>
        <button id="reconfigure" type="button" style="margin-top: 8px;">Change backend configuration</button>
      </section>
      <section class="log card">
        <p class="label">Log</p>
        <ol id="log"></ol>
      </section>
    </main>
    <script src="renderer.bundle.js" defer></script>
  </body>
</html>
